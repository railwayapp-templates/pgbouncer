name: Build and Push PgBouncer Image

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight UTC (rebase on fresh alpine)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/build-and-push.yml"

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  build-pgbouncer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read PgBouncer version from Dockerfile
        id: get_version
        run: |
          VERSION=$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -1)
          MAJOR_MINOR=${VERSION%.*}
          MAJOR=${VERSION%%.*}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "Building PgBouncer ${VERSION} with tags: ${VERSION}, ${MAJOR_MINOR}, ${MAJOR}, latest"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with multiple tags
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.major_minor }}
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.major }}
            ghcr.io/${{ github.repository }}:latest
