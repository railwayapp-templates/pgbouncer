name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build test image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: pgbouncer-e2e-test:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run e2e harness
        shell: bash
        run: |
          ./test/e2e.sh 2>&1 | tee e2e.log
          exit "${PIPESTATUS[0]}"

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p failure-artifacts
          mv e2e.log failure-artifacts/ 2>/dev/null || true
          docker ps -a > failure-artifacts/docker-ps.txt 2>&1 || true
          for c in $(docker ps -aq --filter "label=pgbouncer-e2e=1"); do
            name=$(docker inspect -f '{{.Name}}' "$c" | sed 's|^/||')
            docker logs --tail 200 "$c" > "failure-artifacts/container-${name}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: failure-artifacts
          retention-days: 14
